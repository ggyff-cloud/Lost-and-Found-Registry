{% extends "base.html" %}
{% block title %}{{ code }} &middot; Lost &amp; Found{% endblock %}
{% block content %}
<div class="card empty" style="max-width: 38rem; margin: 0 auto;">
  <div class="empty__mark" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 8v5"></path>
      <path d="M12 16.5v.01"></path>
    </svg>
  </div>
  <h2>{{ code }} &mdash; {{ message }}</h2>
  <p>That item id does not exist. The list shows every item that is still waiting for an owner.</p>
  <a class="btn btn--primary" href="{{ url_for('index') }}">Back to the list</a>
</div>
{% endblock %}
